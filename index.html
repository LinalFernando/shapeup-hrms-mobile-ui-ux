<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShapeUP – HRMS Mobile App UI/UX</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #666;
            font-size: 17px;
            max-width: 700px;
            margin: auto;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto 60px;
            padding: 0 20px;
        }

        .figma-container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        iframe {
            width: 100%;
            height: 700px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }

            iframe {
                height: 600px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>ShapeUP – HRMS Mobile App UI/UX</h1>

        <p class="subtitle">
            A modern Human Resource Management System mobile application
            UI/UX design created using Figma, focusing on clean interfaces,
            intuitive navigation, and a user-friendly mobile experience.
        </p>
    </header>

    <div class="container">

        <div class="figma-container">

            <iframe
                src="https://embed.figma.com/design/XwrONdFnxCYl1IEvfBRznP/ShapeUP-HRMS-Mobile-App-UI?node-id=0-1&embed-host=share"
                allowfullscreen>
            </iframe>

        </div>

    </div>

    <footer>
        Designed by Linal Fernando
    </footer>

</body>
</html>
